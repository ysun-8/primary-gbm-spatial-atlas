name: Publish primary atlas data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check data size
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          size = sum(p.stat().st_size for p in Path('public').rglob('*') if p.is_file())
          print(f'Published data: {size:,} bytes')
          assert size < 1_000_000_000, 'GitHub Pages size limit exceeded'
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
